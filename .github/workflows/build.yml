name: Build WR740N v4

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "Tag/branch do OpenWrt"
        default: "v24.10.8"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "files/**"

env:
  OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'v24.10.8' }}
  IMAGE_LIMIT_KB: 3904

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clonar OpenWrt
        run: git clone --depth 1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Aplicar arquivos e configuracao
        env:
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: |
          cp -r files openwrt/files
          chmod +x openwrt/files/etc/uci-defaults/*
          cp config/wr740n-v4.config openwrt/.config
          # Segredos opcionais: nada e gravado no repositorio.
          sed -i "s|@@WIFI_PSK@@|${WIFI_PSK}|g" openwrt/files/etc/uci-defaults/90-guest-portal
          if [ -n "$SSH_PUBKEY" ]; then
            mkdir -p openwrt/files/etc/dropbear
            printf '%s\n' "$SSH_PUBKEY" > openwrt/files/etc/dropbear/authorized_keys
            chmod 600 openwrt/files/etc/dropbear/authorized_keys
          fi
          cd openwrt && make defconfig
          grep -E 'wr740n-v4|nodogsplash' .config

      - name: Baixar fontes
        working-directory: openwrt
        run: make download -j8

      - name: Compilar
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Verificar tamanho da imagem
        working-directory: openwrt
        run: |
          ls -l bin/targets/ath79/tiny/ | grep -i wr740n
          for f in bin/targets/ath79/tiny/*wr740n-v4*sysupgrade.bin; do
            kb=$(( $(stat -c %s "$f") / 1024 ))
            echo "$f = ${kb} KB (limite ${IMAGE_LIMIT_KB} KB)"
            [ "$kb" -le "$IMAGE_LIMIT_KB" ] || { echo "Imagem grande demais"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-wr740n-v4
          path: |
            openwrt/bin/targets/ath79/tiny/*wr740n-v4*
            openwrt/bin/targets/ath79/tiny/sha256sums
            openwrt/bin/targets/ath79/tiny/*.manifest
            openwrt/bin/targets/ath79/tiny/config.buildinfo
          if-no-files-found: error
